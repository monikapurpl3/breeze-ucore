[package]
name = "ucore-host"
description = "Breeze μCore on an ordinary computer: development, tests, small routers."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ucore"
path = "src/main.rs"

[dependencies]
ucore = { path = "../ucore" }
getrandom = "0.2.17"
# The local zone, for timers and schedules: the library Breeze Core reads it
# with, so both agree on what "07:30" is.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
serde_json = "1"
ed25519-dalek = "2.2.0"
base64 = "0.22.1"
