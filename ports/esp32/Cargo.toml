[package]
name = "ucore-esp32"
description = "Breeze μCore on an ESP32: esp-hal and smoltcp, driven by the core's own poll loop."
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace: it builds with Espressif's toolchain for a chip target,
# the rest of the repository with the ordinary one for the host.
[workspace]

[[bin]]
name = "ucore"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["esp32s3", "qemu"]
# The chip, exactly one. An ESP32-S3 builds with Espressif's Xtensa toolchain;
# an ESP32-C6 is RISC-V and builds with the ordinary one (see README.md).
esp32s3 = ["esp-hal/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-storage/esp32s3", "esp-alloc/esp32s3", "esp-println/esp32s3", "esp-backtrace/esp32s3", "esp-radio?/esp32s3", "esp-rtos?/esp32s3"]
esp32c6 = ["esp-hal/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-storage/esp32c6", "esp-alloc/esp32c6", "esp-println/esp32c6", "esp-backtrace/esp32c6", "esp-radio?/esp32c6", "esp-rtos?/esp32c6"]
# Espressif's QEMU: the OpenCores Ethernet MAC it emulates, no radio.
qemu = []
# A real chip on Wi-Fi.
wifi = ["dep:esp-radio", "dep:esp-rtos", "dep:embassy-futures"]
# Heap and socket figures on the console every 10 s.
stats = ["esp-alloc/internal-heap-stats"]

[dependencies]
ucore = { path = "../../crates/ucore" }
esp-hal = { version = "~1.2.2", features = ["unstable"] }
esp-bootloader-esp-idf = "0.6.0"
esp-storage = "0.10.0"
esp-alloc = "0.11.0"
esp-println = "0.18.0"
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "unstable", "wifi"], optional = true }
embassy-futures = { version = "0.1", optional = true }
esp-rtos = { version = "0.4.0", features = ["esp-alloc", "esp-radio"], optional = true }
# The SHA-512 Ed25519 verification needs, as a loop rather than 80 rounds
# unrolled: 45 KB of flash otherwise (the host build keeps the fast one).
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns",
  "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns",
] }

[profile.release]
# "s", not "z": on Xtensa "z" came out 25 KB larger.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2
